<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Archivos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>BIENVENIDO</h1>
            <div id="auth-section">
                <div id="login-form">
                    <h2>Iniciar Sesión</h2>
                    <form id="loginForm">
                        <input type="text" id="loginUsername" placeholder="Usuario" required>
                        <input type="password" id="loginPassword" placeholder="Contraseña" required>
                        <button type="submit">Ingresar</button>
                    </form>
                    <p>¿No tienes cuenta? <a href="#" id="show-register">Regístrate</a></p>
                </div>
                
                <div id="register-form" style="display: none;">
                    <h2>Registro</h2>
                    <form id="registerForm">
                        <input type="text" id="regUsername" placeholder="Usuario" required>
                        <input type="email" id="regEmail" placeholder="Email" required>
                        <input type="password" id="regPassword" placeholder="Contraseña" required>
                        <button type="submit">Registrarse</button>
                    </form>
                    <p>¿Ya tienes cuenta? <a href="#" id="show-login">Inicia sesión</a></p>
                </div>
                
                <div id="user-section" style="display: none;">
                    <p>Bienvenido, <span id="username-display"></span></p>
                    <button id="logout-btn">Cerrar Sesión</button>
                </div>
            </div>
        </header>
        
        <main id="main-content" style="display: none;">
            <section id="upload-section">
                <h2>Subir Archivo</h2>
                <form id="uploadForm">
                    <input type="file" id="fileInput" required>
                    <button type="submit">Subir</button>
                </form>
            </section>
            
            <section id="files-section">
                <h2>Tus Archivos</h2>
                <ul id="files-list"></ul>
            </section>
            
            <section id="notifications-section">
                <h2>Notificaciones <span id="notification-badge" class="badge">0</span></h2>
                <ul id="notifications-list"></ul>
            </section>
        </main>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
