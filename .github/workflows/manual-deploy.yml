name: WATOC 2028 CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno que se va a desplegar'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      target:
        description: '¿Qué deseas desplegar?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend

jobs:
  deploy:
    name: Deploy project in VPS
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_VPS_HOST || secrets.DEV_VPS_HOST }}
      VPS_USER: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_VPS_USER || secrets.DEV_VPS_USER }}
      VPS_SSH_KEY: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_VPS_SSH_KEY || secrets.DEV_VPS_SSH_KEY }}
      FRONTEND_DEPLOY_PATH: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_FRONTEND_DEPLOY_PATH || secrets.DEV_FRONTEND_DEPLOY_PATH }}
      PROJECT_PATH: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_PROJECT_PATH || secrets.DEV_PROJECT_PATH }}
      DJANGO_SERVICE_NAME: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_DJANGO_SERVICE_NAME || secrets.DEV_DJANGO_SERVICE_NAME }}
 
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend' }}
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Compile React
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend' }}
        env:
          VITE_API_URL: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_VITE_API_URL || secrets.DEV_VITE_API_URL }}
    
        run: |
          cd frontend
          
          echo "VITE_API_URL=${VITE_API_URL}" > .env.production
          
          pnpm install --frozen-lockfile
          pnpm build

      - name: Copy dist to VPS
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          port: 22
          source: "frontend/dist/*"
          target: ${{ env.FRONTEND_DEPLOY_PATH }}
          strip_components: 2
          debug: true

      - name: Deploy backend
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'backend' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          port: 22
          debug: true
          timeout: 10m
          command_timeout: 10m
          script: |
            set -e
            
            echo ">>> Actualizando Django en [${{ github.event.inputs.environment }}]..."
            
            cd ${{ env.PROJECT_PATH }}
            git pull origin ${{ github.ref_name }}
            
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate
            python manage.py collectstatic --noinput

            sudo systemctl restart ${{ env.DJANGO_SERVICE_NAME }}
            
            echo ">>> Despliegue en ${{ github.event.inputs.environment }} finalizado con éxito."
            
