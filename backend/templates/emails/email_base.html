{% autoescape off %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&amp;display=swap"
        rel="stylesheet" type="text/css">


    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
            font-family: 'Inter', Helvetica, Arial, sans-serif
        }

        table {
            border-collapse: collapse;
            border-spacing: 0
        }

        img {
            border: 0;
            display: block;
            outline: none;
            text-decoration: none
        }

        .wrapper {
            width: 100%;
            background: #ffffff
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto
        }

        .logo-space {
            padding: 24px 0 32px 0
        }

        .card {
            background: #f5f5f7;
            border-radius: 24px
        }

        .card-padding {
            padding: 40px;
        }

        .footer {
            background: #d6d6dd;
            border-radius: 24px 24px 0 0
        }

        .footer-padding {
            padding: 44px 10px
        }

        .text {
            color: #4a4f5f;
            font-size: 16px;
            line-height: 1.5;
            font-weight: 300
        }

        .footer-text {
            color: #4a4f5f;
            font-size: 14px;
            line-height: 1.6;
            text-align: center
        }

        h1 {
            margin: 0;
            color: #040b22;
            font-size: 32px;
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: -1px
        }

        h2 {
            margin: 0;
            color: #040b22;
            font-size: 24px;
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: -1px
        }

        hr {
            border: none;
            border-top: 1px solid #d9d9d9;
            margin: 24px 0
        }

        @media only screen and (max-width:720px) {
            .container {
                width: 100% !important
            }

            .mobile-padding {
                padding-left: 16px !important;
                padding-right: 16px !important
            }

            .card-padding {
                padding: 24px 16px !important
            }

            h1 {
                font-size: 28px !important
            }

            h2 {
                font-size: 20px !important
            }

            .logo {
                width: 100% !important;
                height: auto !important
            }
        }
    </style>

</head>

<body>

    <table class="wrapper" width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
        <tr>
            <td align="center">

                <!-- LOGO -->
                <table class="container" width="600" cellpadding="0" cellspacing="0" border="0" role="presentation">
                    <tr>
                        <td class="logo-space" align="center">

                            <a href="https://watoc2028.org/" target="_blank">
                                <img src="https://watoc2028.org/logo.png" alt="WATOC 2028 Logo" width="560" class="logo"
                                    style="width:480px;max-width:520px;height:auto;">
                            </a>

                        </td>
                    </tr>
                </table>

                <!-- CONTENT -->
                <table class="container mobile-padding" width="700" cellpadding="0" cellspacing="0" border="0"
                    role="presentation">
                    <tr>
                        <td>

                            <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation"
                                class="card">
                                <tr>
                                    <td class="card-padding">

                                        {% block content %}
                                        {% endblock %}

                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>
                </table>

                <!-- SPACER -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
                    <tr>
                        <td height="24"></td>
                    </tr>
                </table>

                <!-- FOOTER -->
                <table class="container mobile-padding" width="700" cellpadding="0" cellspacing="0" border="0"
                    role="presentation">
                    <tr>
                        <td>

                            <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation"
                                class="footer">
                                <tr>
                                    <td class="footer-padding">

                                        <div class="footer-text">

                                            <p style="margin:0;">
                                                Km. 6 Antigua carretera a Progreso<br>
                                                Apdo. Postal 73, Cordemex, 97310<br>
                                                Mérida, Yucatán, México
                                            </p>

                                            <p style="margin:20px 0 0 0;">
                                                © 2025 WATOC 2028. All rights reserved.
                                            </p>

                                        </div>

                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>

</html>
{% endautoescape %}
