      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          pattern: ^([a-zA-Z].[\w]+(?:\.\w+)?)+@([\w]+(?:\.[a-z]{2,10})+)$
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
