        refresh:
          type: string
      required:
      - access
      - refresh
    Tour:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 48
        description:
          type: string
        image:
          type: string
          format: uri
          nullable: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - description
      - id
      - name
      - price
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          pattern: ^([a-zA-Z].[\w]+(?:\.\w+)?)+@([\w]+(?:\.[a-z]{2,10})+)$
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
        first_name:
          type: string
          pattern: ^([a-zA-Z\u00c0-\u00fa]{2,})([ -]?[a-zA-Z\u00c0-\u00fa]{2,})*$
          maxLength: 150
        middle_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          pattern: ^([a-zA-Z\u00c0-\u00fa]{2,})([ -]?[a-zA-Z\u00c0-\u00fa]{2,})*$
          maxLength: 150
        prefix:
          $ref: '#/components/schemas/PrefixEnum'
        pronouns:
          type: string
          maxLength: 50
        nationality:
          $ref: '#/components/schemas/NationalityEnum'
        city:
          type: string
          maxLength: 30
        photo:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        roles:
          type: string
          readOnly: true
        last_login:
          type: string
          format: date-time
          nullable: true
        date_joined:
          type: string
          format: date-time
        participant:
          $ref: '#/components/schemas/Participant'
      required:
      - city
      - email
      - full_name
      - id
      - password
      - photo
      - roles
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
