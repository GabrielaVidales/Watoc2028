        abstract_id:
          type: integer
          writeOnly: true
        first_name:
          type: string
          maxLength: 128
        last_name:
          type: string
          maxLength: 128
        email:
          type: string
          format: email
          maxLength: 254
        order:
          type: integer
          readOnly: true
      required:
      - abstract_id
      - id
      - order
    AuthorAffiliation:
      type: object
      properties:
        id:
          type: integer
        institute:
          type: string
          maxLength: 100
        department:
          type: string
          maxLength: 100
        nationality:
