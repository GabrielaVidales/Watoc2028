components:
  schemas:
    Abstract:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Título
          maxLength: 128
        text:
          type: string
          title: Texto
        references:
          type: string
          title: Referencias
        presentation_type:
          title: Tipo de presentación
          oneOf:
          - $ref: '#/components/schemas/PresentationTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          title: Estado del abstract
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Fecha de creación
        last_update:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Última actualización
        last_review_at:
          type: string
          format: date-time
          nullable: true
        user:
          type: integer
          nullable: true
      required:
      - created_at
      - id
      - last_update
    AbstractDeclarations:
      type: object
      properties:
        abstract_id:
          type: integer
          writeOnly: true
        confirm_accuracy:
          type: boolean
          title: Information Correctness
          description: I confirm that I have reviewed this abstract and that all information
            is correct. I acknowledge that the content cannot be edited after final
            submission and will be published exactly as submitted.
        consent_publication:
          type: boolean
          title: Consent to Publication
          description: The submission of an abstract constitutes your consent to publication
            (e.g. congress website, programme, other promotions, etc.).
        submit_on_behalf:
          type: boolean
          title: Submit on behalf of all authors
          description: I confirm that I submit this abstract on behalf of all authors.
            The contact details saved are those of the first author, who is responsible
            for informing the others.
        commitment_attendance:
          type: boolean
          title: Commitment to Attend
          description: The abstract submission constitutes a formal commitment by
            the first author to physically attend the ECP and present the abstract
            in the assigned session.
        not_previously_published:
          type: boolean
          description: I herewith confirm that the abstract has not been previously
            published.
        no_ai_used:
          type: boolean
          title: No AI Tools Used
          description: I herewith confirm that the abstract was prepared without using
            the aid of AI tools (such as, but not limited to, ChatGPT).
      required:
      - abstract_id
    Author:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        affiliation:
          allOf:
          - $ref: '#/components/schemas/AuthorAffiliation'
